# ===== Gradle 自身 =====
# 这是给 Gradle 守护进程的内存，不是给 Minecraft 的
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=false
# 与 Beyond Dimensions 保持一致（保守）
org.gradle.configuration-cache=false
# 沙箱下 Gradle 的原生文件监视会报 "Couldn't open current thread, error = 5"，关掉它
org.gradle.vfs.watch=false

# ===== 环境版本 =====
# 版本查询入口：https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# neo_version 必须与 minecraft_version 匹配，否则拿不到有效 artifact
# ⚠️ 与使用者的实机环境对齐为 21.1.249。
#    原因：JEI 19.44.0.401 要求 NeoForge >= 21.1.238，而 21.1.234 会让 dev 端的
#    run 直接崩在模组加载阶段（"Mod jei requires neoforge 21.1.238 or above"）。
#    使用者的 1.21.1 实例本身就是 21.1.249，对齐后也消除了开发/实机的版本偏差。
neo_version=21.1.249
# 下界取 Beyond Dimensions 的 [21.1.194,)（它比 ProjectE 的 [21.1.119,) 更严）
neo_version_range=[21.1.194,)
loader_version_range=[1,)

# ===== Parchment（更好的参数名 / Javadoc）=====
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ===== 本模组属性 =====
mod_id=beyondemc
mod_name=Beyond EMC
mod_license=MIT
mod_version=0.3.1
mod_group_id=com.zhuyuhang.beyondemc
mod_authors=ZhuYuhang
mod_description=An addon bridging Beyond Dimensions and ProjectE. Stores EMC inside the dimensional network, converts EMC-valued items into EMC on deposit, and lets you exchange network EMC for learned items directly in the network UI.

# ===== 依赖坐标（备用方案：CurseMaven）=====
# 首选是 libs/ 下的本地 jar（见 docs/VERSIONS.md）。
# 若要切到 CurseMaven，把 build.gradle 里的 files(...) 四行换成注释中的 curse.maven 两对。
bd_curse_project_id=1222890
bd_curse_file_id=8812500
projecte_curse_project_id=226410
projecte_curse_file_id=6611984

# ===== JEI（可选依赖，仅用于 0.2.0 的配方填充集成）=====
# 版本由使用者指定为 19.44.0.401。
#
# ⚠️ 风险记录（务必知情）：Beyond Dimensions 是按 JEI 【API 19.27.0.340】编译的
#    权威来源：reference/BeyondDimensions/gradle.properties:39  jei_version = 19.27.0.340
#    若 BD 的 JEI 集成模块引用了在 19.44 里被改动/移除的 API，
#    该模块会注册失败 —— 它的 IRecipeTransferHandler 就不存在，
#    我们的 TransferHelperMixin 也就不会触发（表现为"JEI 填充没反应"且无任何报错）。
#    真出现这种情况，改用 19.27.0.340 即可验证是否为此原因。
jei_version=19.44.0.401
jei_maven_url=https://maven.blamejared.com
