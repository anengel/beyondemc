plugins {
    id 'java-library'
    id 'idea'
    // 版本与 Beyond Dimensions 保持一致（同 MC/NeoForge 世代，已验证可用）
    // 版本来源：https://plugins.gradle.org/plugin/net.neoforged.moddev
    id 'net.neoforged.moddev' version '2.0.116'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

// 1.21.1 随游戏分发 Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()

    // 备用方案：CurseMaven 代理（首选是本地 libs/，见下方 dependencies）
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    // JEI 的公共 Maven。JEI 是**可选**依赖（见下方 dependencies 与
    // docs/plan/ROADMAP-0.2.0.md §2），但编译我们的 JEI Mixin 需要它的类型。
    maven {
        name = 'BlameJared'
        url = project.jei_maven_url
        content {
            includeGroup 'mezz.jei'
        }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // ============================================================
    // 前置模组依赖 —— 两种接入方式自动择一
    //
    //   1) libs/ 下有本地 jar（开发机 / 离线构建）→ 用本地文件
    //   2) 没有（从仓库克隆下来）→ 回退到 CurseMaven 坐标
    //
    // 之所以**不把 libs/*.jar 提交进仓库**：那是第三方模组的二进制，
    // 重新分发既无必要也容易造成版本混乱（.gitignore 已排除）。
    // 获取方式见 libs/README.md 与 docs/VERSIONS.md。
    //
    // 坐标来源：docs/VERSIONS.md（CurseForge projectId / fileId，已核实）
    // ============================================================
    def bdJar = file('libs/beyonddimensions-1.21.1-0.7.30.jar')
    def peJar = file('libs/projecte-1.21.1-1.1.0.jar')

    // 用 compileOnly + runtimeOnly —— 与 Beyond Dimensions 自己的写法一致。
    //
    // ⚠️ 实测教训：**不要**用 additionalRuntimeClasspath 来放模组依赖。
    // 用了之后 runServer 的 Mod List 里只有 beyondemc / minecraft / neoforge，
    // 报 "Mod beyondemc requires beyonddimensions ... Currently, beyonddimensions is not installed"。
    // 在 MDG 里 additionalRuntimeClasspath 是给「需要进 run 类路径的普通库」用的
    // （BD 只用它装 tinypinyin），不是给模组用的。
    if (bdJar.exists()) {
        compileOnly files(bdJar)
        runtimeOnly files(bdJar)
    } else {
        compileOnly "curse.maven:beyond-dimensions-1222890:8812500"
        runtimeOnly "curse.maven:beyond-dimensions-1222890:8812500"
    }

    if (peJar.exists()) {
        compileOnly files(peJar)
        runtimeOnly files(peJar)
    } else {
        compileOnly "curse.maven:projecte-226410:6611984"
        runtimeOnly "curse.maven:projecte-226410:6611984"
    }

    // ------------------------------------------------------------
    // JEI —— **可选**依赖，且**只 compileOnly**。
    //
    // 为什么只有 compileOnly：
    //   JEI 是客户端专用模组。若放进 runtime 类路径，专用服务器的模组加载会看到它
    //   却无法满足其 CLIENT 侧依赖 —— 那会让我们的无头自检（runServer）失效。
    //   本模组**不依赖 JEI 存在**（mods.toml 里声明为 optional），所以能编译即可。
    //
    // 想测"JEI 配方填充"就把它放进游戏的 mods/：
    //   libs/jei-1.21.1-neoforge-<版本>.jar 是本地副本，tools/install-to-mods.cmd 会一并装上。
    // ------------------------------------------------------------
    def jeiJar = file("libs/jei-1.21.1-neoforge-${jei_version}.jar")
    compileOnly(jeiJar.exists()
            ? files(jeiJar)
            : "mezz.jei:jei-1.21.1-neoforge:${jei_version}")

    // 但**测试**时它必须真在 run 里，否则 JEI 集成无从验证。
    // 用 -PwithJei 显式开关（tools/play.cmd 会带上），这样 runServer / 自检
    // 的类路径保持干净 —— 客户端专用模组不该进专用服务器。
    if (providers.gradleProperty('withJei').isPresent()) {
        runtimeOnly(jeiJar.exists()
                ? files(jeiJar)
                : "mezz.jei:jei-1.21.1-neoforge:${jei_version}")
        logger.lifecycle("[BeyondEMC] withJei 已启用：JEI ${jei_version} 会进入 run 类路径")
    }
}

// ===== 用 src/main/templates 展开 neoforge.mods.toml 里的 ${} 占位符 =====
// 与 Beyond Dimensions 的做法一致
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata

// 让 IDE 同步时自动执行，不必手动跑
neoForge.ideSyncTask generateModMetadata

// 把 LICENSE 一起打进 jar 的 META-INF（MIT 要求保留版权声明）
tasks.named('processResources', ProcessResources).configure {
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
